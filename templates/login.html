<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="google-client-id" content="{{ google_cid }}">

    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/styles_admin.css">
    <link rel="icon" type="image/png" href="/icon.png">
    <title id="title_text">Chasidus TV - Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <h1 class="login-title"><a href="/">Chasidus TV</a></h1>
                <p class="login-subtitle">Yehi Adonenu</p>
            </div>

            <div class="login-content">
                <div class="status-message" id="status">
                    <div class="status-spinner"></div>
                    <span>Checking authorization...</span>
                </div>

                <div class="google-button-wrapper" id="google_button"></div>

            </div>
        </div>
    </div>

    <script src="/script.js"></script>
    <script src="/script_admin.js"></script>
</body>

</html>
